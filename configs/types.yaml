1:
  name: Базовый повседневный спрос
  interpretation: Высокая доля продовольствия сочетается с низкой долей общепита и сравнительно невысокой зарплатой.
2:
  name: Смешанный потребительский спрос
  interpretation: Промежуточный уровень расходов и разнообразная корзина без выраженного перекоса в одну категорию.
3:
  name: Повседневный спрос с низкой долей транспорта
  interpretation: Относительно высокая доля продовольствия и маркетплейсов сочетается с низкими долями транспорта и здоровья.
4:
  name: Высокие расходы при удалённости рынков
  interpretation: Высокая зарплата и уровень расходов сочетаются с низкой доступностью рынков и меньшей долей маркетплейсов.
5:
  name: Расширенный спрос на услуги
  interpretation: Выше доли общепита, здоровья и транспорта, ниже доля продовольствия. Внешние данные показывают более крупные рынки.
